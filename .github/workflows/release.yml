name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.version.outputs.android }}
      tv: ${{ steps.version.outputs.tv }}
      companion: ${{ steps.version.outputs.companion }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_metadata.py --check-existing >> "$GITHUB_OUTPUT"

  android:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Test, lint and build unsigned APKs
        run: >-
          ./gradlew -PunsignedRelease=true
          :app:testStandardDebugUnitTest :app:testVoiceDebugUnitTest
          :app:lintStandardRelease :app:lintVoiceRelease
          :app:assembleStandardRelease :app:assembleVoiceRelease
          :tv:testDebugUnitTest :tv:lintRelease :tv:assembleRelease
      - name: Stage unsigned APKs
        env:
          VERSION: ${{ needs.version.outputs.android }}
        run: |
          mkdir -p dist
          cp "app/build/outputs/apk/standard/release/Air-Remote-$VERSION.apk" dist/Air-Remote.apk
          cp "app/build/outputs/apk/voice/release/Air-Remote-Voice-$VERSION.apk" dist/Air-Remote-Voice.apk
          cp tv/build/outputs/apk/release/tv-release-unsigned.apk dist/Air-Home.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No checkout, build scripts or Gradle cache on the runner holding private keys.
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-android
          path: unsigned
      - name: Sign and verify APKs
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          TV_SIGNING_KEY_BASE64: ${{ secrets.TV_SIGNING_KEY_BASE64 }}
          TV_SIGNING_PASSWORD: ${{ secrets.TV_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import base64, os, re, subprocess, tempfile
          from pathlib import Path
          os.umask(0o077)
          Path('dist').mkdir(exist_ok=True)
          signer = str(Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner')
          secrets = ('ANDROID_SIGNING_KEY_BASE64', 'ANDROID_SIGNING_PASSWORD',
                     'TV_SIGNING_KEY_BASE64', 'TV_SIGNING_PASSWORD')
          if any(not os.environ.get(name) for name in secrets):
              raise SystemExit('Configure the Android and TV signing secrets')
          clean_env = {k: v for k, v in os.environ.items() if k not in secrets}
          specs = (
              ('ANDROID', 'air-remote', ('Air-Remote.apk', 'Air-Remote-Voice.apk'),
               'eb268bd67e9c38a368e58479f4ebcbaab107000d2626477e171eb642bee83f1d'),
              ('TV', 'air-home', ('Air-Home.apk',),
               'e3e954c05fd51cc6a5b04752f6cbcb0804258e61ea98b3c0a9e9a78b313e9d12'),
          )
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temporary:
              for prefix, alias, files, expected in specs:
                  key = Path(temporary, prefix + '.p12')
                  password = Path(temporary, prefix + '.password')
                  key.write_bytes(base64.b64decode(os.environ[prefix + '_SIGNING_KEY_BASE64'], validate=True))
                  password.write_text(os.environ[prefix + '_SIGNING_PASSWORD'])
                  for name in files:
                      subprocess.run([signer, 'sign', '--ks', str(key), '--ks-key-alias', alias,
                          '--ks-pass', 'file:' + str(password), '--v4-signing-enabled', 'false',
                          '--out', 'dist/' + name, 'unsigned/' + name], check=True, env=clean_env)
                      verification = subprocess.check_output([signer, 'verify', '--print-certs',
                          'dist/' + name], env=clean_env, text=True)
                      digests = re.findall(r'^Signer #\d+ certificate SHA-256 digest: (\w+)$', verification, re.M)
                      if digests != [expected]:
                          raise SystemExit('Unexpected signing certificate: ' + name)
                      print(name + ': signature verified')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  companion:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install NSIS
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }
          }
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D clippy::all
      - name: Build installer
        run: python scripts/build-installer.py --target x86_64-pc-windows-msvc
      - name: Stage installer
        env:
          VERSION: ${{ needs.version.outputs.companion }}
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item "../artifacts/Air-Companion-Setup-$env:VERSION.exe" ../dist/Air-Companion-Setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-companion
          path: dist/Air-Companion-Setup.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, sign, companion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          ANDROID_VERSION: ${{ needs.version.outputs.android }}
          TV_VERSION: ${{ needs.version.outputs.tv }}
          COMPANION_VERSION: ${{ needs.version.outputs.companion }}
        run: |
          test -s dist/Air-Remote.apk
          test -s dist/Air-Remote-Voice.apk
          test -s dist/Air-Home.apk
          test -s dist/Air-Companion-Setup.exe
          (cd dist && sha256sum Air-Remote.apk Air-Remote-Voice.apk Air-Home.apk Air-Companion-Setup.exe > SHA256SUMS)
          cat > notes.md <<EOF
          Air Remote $ANDROID_VERSION · Air Home $TV_VERSION · Air Companion $COMPANION_VERSION.

          Android 9+ · Windows 10/11 x64.

          [Пульт](https://github.com/$GH_REPO/releases/download/$TAG/Air-Remote.apk) · [Пульт с Эйром](https://github.com/$GH_REPO/releases/download/$TAG/Air-Remote-Voice.apk) · [Air Home для ТВ](https://github.com/$GH_REPO/releases/download/$TAG/Air-Home.apk) · [Компаньон](https://github.com/$GH_REPO/releases/download/$TAG/Air-Companion-Setup.exe)

          Обычная сборка — без фонового Эйра; Voice — с локальными голосовыми командами. Микрофон для ПК и голосовой поиск ТВ есть в обеих. APK поддерживают ARM32 и ARM64.

          [Установка Air Home](https://github.com/$GH_REPO/blob/master/tv/README.md#установка-на-телевизор) · [Подключение и описание](https://github.com/$GH_REPO#readme) · [Микрофон](https://github.com/$GH_REPO/blob/master/docs/microphone.md)
          EOF
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Air Remote $ANDROID_VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file notes.md
