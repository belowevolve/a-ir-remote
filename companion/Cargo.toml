[package]
name = "air-remote-companion"
version = "0.5.5"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.15.3"
directories = "6"
local-ip-address = "0.6"
prost = "0.14"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
rcgen = "0.13"
rtrb = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
